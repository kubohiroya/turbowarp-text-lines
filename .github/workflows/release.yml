name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-existing:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.21.0
      - name: Verify release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          node --input-type=module -e "import fs from 'node:fs'; const p = JSON.parse(fs.readFileSync('package.json')); if (p.name !== '@kubohiroya/turbowarp-text-lines' || p.version !== '0.3.0') throw new Error('Main has advanced');"
          gh release download v0.3.0 --repo kubohiroya/turbowarp-text-lines --pattern kubohiroya-turbowarp-text-lines-0.3.0.tgz
          echo '2e555169b1ae0f5b8a243aa7dee5ddec9b22c03f  kubohiroya-turbowarp-text-lines-0.3.0.tgz' | sha1sum --check
          tar -xOf kubohiroya-turbowarp-text-lines-0.3.0.tgz package/package.json > package-metadata.json
          node --input-type=module -e "import fs from 'node:fs'; const p = JSON.parse(fs.readFileSync('package-metadata.json')); if (p.name !== '@kubohiroya/turbowarp-text-lines' || p.version !== '0.3.0') throw new Error('Unexpected package');"
      - name: Publish once with provenance and finalize tags
        run: |
          set -eu
          npm view @kubohiroya/turbowarp-text-lines@0.3.0 --json --prefer-online > published.json 2> registry-error.txt || {
            node --input-type=module -e "import fs from 'node:fs'; const p = JSON.parse(fs.readFileSync('published.json')); if (p.error?.code !== 'E404') throw new Error('Registry lookup failed');"
            npm publish ./kubohiroya-turbowarp-text-lines-0.3.0.tgz --access public --provenance --tag latest --ignore-scripts
          }
          npm view @kubohiroya/turbowarp-text-lines@0.3.0 dist.shasum --json --prefer-online > visible-hash.json 2>/dev/null || true
          node --input-type=module -e "import fs from 'node:fs'; const t=fs.readFileSync('visible-hash.json','utf8').trim(); if(t){ const p=JSON.parse(t); if(!p.error && p!=='2e555169b1ae0f5b8a243aa7dee5ddec9b22c03f') throw new Error('Published artifact differs'); if(p.error && p.error.code!=='E404') throw new Error('Registry lookup failed'); }"
          node scripts/finalize-release-tags.ts @kubohiroya/turbowarp-text-lines 0.3.0
          npm view @kubohiroya/turbowarp-text-lines@0.3.0 dist.shasum --json --prefer-online > published-hash.json
          node --input-type=module -e "import fs from 'node:fs'; if (JSON.parse(fs.readFileSync('published-hash.json')) !== '2e555169b1ae0f5b8a243aa7dee5ddec9b22c03f') throw new Error('Published artifact differs');"
